# FragPipe-Analyst — Docker Compose
# App URL: http://<host-ip>:3838/fragpipe-analyst/
 
services:
  fragpipe-analyst:
    build:
      context: .
      dockerfile: Dockerfile.local
 
    image: fragpipe-analyst:local
    pull_policy: build
 
    container_name: fragpipe-analyst
    restart: unless-stopped
 
    ports:
      - "3838:3838"
 
    environment:
      APPLICATION_LOGS_TO_STDOUT: "true"
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      TZ: Etc/UTC
 
    configs:
      - source: shiny_server_conf
        target: /etc/shiny-server/shiny-server.conf
        mode: 0444
      - source: rprofile_noop
        target: /srv/shiny-server/fragpipe-analyst/.Rprofile
        mode: 0444
 
    volumes:
      - shiny_logs:/var/log/shiny-server
      # Persistent extra R library. Lets you install missing packages into a
      # running container without rebuilding the image — they survive redeploys.
      - extra_rlib:/opt/rlibs
 
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3838"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
 
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
 
configs:
  rprofile_noop:
    content: |
      # renv autoloader intentionally disabled inside the container.
      # Packages are installed system-wide via the Dockerfile.
      #
      # Add /opt/rlibs (a persistent volume) to the library search path so
      # packages installed there are visible to the Shiny app. Set via .Rprofile
      # rather than an env var, because shiny-server's "su --login" wipes the
      # container environment before starting R.
      local({
        extra <- "/opt/rlibs"
        if (dir.exists(extra)) .libPaths(c(extra, .libPaths()))
      })
 
  shiny_server_conf:
    content: |
      # If PDF/report export later fails with a permission error, use: run_as root;
      run_as shiny;
 
      preserve_logs true;
      # Flip to true once the app works, to hide internal R errors from users.
      sanitize_errors false;
 
      http_keepalive_timeout 3600;
 
      server {
        listen 3838;
 
        location / {
          site_dir /srv/shiny-server;
          log_dir /var/log/shiny-server;
          directory_index on;
 
          # Default is 60s; this app needs far longer on a cold start.
          app_init_timeout 1800;
          app_idle_timeout 3600;
        }
      }
 
volumes:
  shiny_logs:
  extra_rlib:
