# FragPipe-Analyst — Docker Compose
# App URL: http://<host-ip>:3838/fragpipe-analyst/
 

services:
  fragpipe-analyst:
    build:
      context: .
      dockerfile: Dockerfile.local
 
    image: fragpipe-analyst:local
    pull_policy: build
 
    container_name: fragpipe-analyst
    restart: unless-stopped
 
    ports:
      - "3838:3838"
 
    environment:
      APPLICATION_LOGS_TO_STDOUT: "true"
      # Belt-and-braces: tells renv's autoloader to stand down. May not survive
      # shiny-server's "su --login", which is why we also mask .Rprofile below.
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      TZ: Etc/UTC
 
    configs:
      - source: shiny_server_conf
        target: /etc/shiny-server/shiny-server.conf
        mode: 0444
      # THE FIX: replaces the repo's .Rprofile (which activates renv) with an
      # inert comment. All R packages are already installed system-wide by the
      # Dockerfile, so renv has no job to do inside this container.
      - source: rprofile_noop
        target: /srv/shiny-server/fragpipe-analyst/.Rprofile
        mode: 0444
 
    volumes:
      - shiny_logs:/var/log/shiny-server
 
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3838"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
 
    # Uncomment and adjust if the container gets OOM-killed on large datasets.
    # deploy:
    #   resources:
    #     limits:
    #       memory: 8G
 
configs:
  rprofile_noop:
    content: |
      # renv autoloader intentionally disabled inside the container.
      # Packages are installed system-wide via the Dockerfile.
 
  shiny_server_conf:
    content: |
      # If PDF/report export later fails with a permission error, switch to: run_as root;
      run_as shiny;
 
      preserve_logs true;
      # Keep this false until everything works, then flip to true to hide
      # internal R errors from end users.
      sanitize_errors false;
 
      http_keepalive_timeout 3600;
 
      server {
        listen 3838;
 
        location / {
          site_dir /srv/shiny-server;
          log_dir /var/log/shiny-server;
          directory_index on;
 
          # Default is 60s; this app needs longer to load Bioconductor packages.
          app_init_timeout 1800;
          app_idle_timeout 3600;
        }
      }
 
volumes:
  shiny_logs:
